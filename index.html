<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07123d" />
    <title>Capitol Quest — Districts of Discovery</title>
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="gameShell">
        <canvas
          id="game"
          width="1280"
          height="720"
          tabindex="0"
          aria-label="Capitol Quest role-playing game"
        ></canvas>
      </div>
      <div id="hint">
        WASD / Arrows · Move &nbsp; Shift · Sprint &nbsp; E / Enter · Interact
        &nbsp; M · Map &nbsp; Q · Journal &nbsp; I · Supplies &nbsp; Esc · Pause
        &nbsp; Mouse / touch · Menus
      </div>
      <div id="tools">
        <button id="fullscreen">Full screen</button
        ><button id="exportSave">Export save</button
        ><button id="importSave">Import save</button
        ><button id="helpButton">How to play</button
        ><input
          id="saveFile"
          type="file"
          accept=".json,application/json"
          hidden
        />
      </div>
      <div id="touchMenu" aria-label="Game actions"></div>
      <div id="mobileControls" aria-label="Touch controls">
        <div class="pad">
          <span class="blank"></span><button class="ctrl" id="up">▲</button
          ><span class="blank"></span> <button class="ctrl" id="left">◀</button
          ><span class="blank"></span><button class="ctrl" id="right">▶</button>
          <span class="blank"></span><button class="ctrl" id="down">▼</button
          ><span class="blank"></span>
        </div>
        <div class="acts">
          <button class="ctrl" id="btnMap">MAP</button
          ><button class="ctrl" id="btnBag">BAG</button
          ><button class="ctrl" id="btnB">B / BACK</button
          ><button class="ctrl" id="btnA">A / OK</button>
        </div>
      </div>
    </div>
    <script src="dist/game.js" defer></script>
  </body>
</html>
